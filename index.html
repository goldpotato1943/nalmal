<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리반 낱말 공책</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
/* 레이아웃: 흰 바탕 + 굵은 검정 테두리. 제목줄 → 단계 탭 → 큰 활동판 → 아래 단추 줄. 태블릿 가로 화면 기준, 좁으면 세로로 쌓임.
   일부러 밝은 한 가지 화면만 씁니다(학급 태블릿용). */
:root{
  --paper:#FFFFFF; --ink:#111111; --muted:#555555; --soft:#EFF0EB; --line:#111111; --faint:#D6D6D0;
  --hl:#FFE066; --good:#12834A; --good-bg:#DDF3E6; --bad:#C4302A; --bad-bg:#FBE2DF;
  --kor:#C8452B; --kor-bg:#FDEBE6; --soc:#0C776C; --soc-bg:#E1F4F1; --sci:#6340C0; --sci-bg:#EEE8FB;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --bw:2.5px; --r:12px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--font);font-size:19px;line-height:1.55;font-weight:500}
.wrap{max-width:1080px;margin:0 auto;padding-inline:clamp(16px,4vw,48px);padding-block:22px 40px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;font-weight:900;line-height:1.25;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid var(--hl);outline-offset:2px}
.muted{color:var(--muted)}
.emo{font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;font-weight:400}

/* 제목줄 */
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--ink);padding-bottom:12px}
.hd h1{font-size:clamp(1.8rem,4.2vw,2.6rem);display:flex;align-items:center;gap:14px}
.pill{border:var(--bw) solid var(--ink);border-radius:99px;padding:6px 18px;font-weight:900;font-size:1.2rem;white-space:nowrap;display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}

/* 단계 탭 / 메뉴 탭 */
.seg{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px}
.seg > *{border:var(--bw) solid var(--ink);border-radius:10px;background:var(--paper);font-weight:900;font-size:1.05rem;padding:9px 6px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg .on{background:var(--ink);color:var(--paper)}
.seg .done{background:var(--soft);color:var(--muted)}
.seg span{cursor:default}

/* 활동판 */
.panel{border:3px solid var(--ink);border-radius:18px;padding:clamp(18px,3vw,30px);display:flex;flex-direction:column;gap:18px;min-width:0}
.label{font-weight:900;font-size:1.05rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.hint{border:var(--bw) dashed var(--ink);background:var(--soft);border-radius:var(--r);padding:14px 18px;font-size:1.12rem;display:flex;gap:10px;align-items:flex-start}
.hint b{font-weight:900;white-space:nowrap}
.note{font-size:1rem;color:var(--ink)}
.hl{background:linear-gradient(transparent 60%,var(--hl) 60%,var(--hl) 94%,transparent 94%);padding:0 .08em}
mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;font-weight:900;padding:0 .08em}

/* 단추 */
.acts{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.acts .sp{flex:1}
.btn{border:var(--bw) solid var(--ink);border-radius:var(--r);background:var(--ink);color:var(--paper);font-weight:900;font-size:1.35rem;padding:14px 28px;min-height:62px;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn.w{background:var(--paper);color:var(--ink);font-size:1.2rem;padding:12px 22px;min-height:58px}
.btn.full{width:100%}
.btn:disabled{opacity:.35;cursor:default}
.btn.danger{background:var(--bad);border-color:var(--bad)}

/* 과목 표시 */
.chip{display:inline-flex;align-items:center;font-size:.9rem;font-weight:900;padding:3px 12px;border-radius:99px;border:2px solid currentColor;white-space:nowrap}
.c-국어{color:var(--kor);background:var(--kor-bg)} .c-사회{color:var(--soc);background:var(--soc-bg)} .c-과학{color:var(--sci);background:var(--sci-bg)}

/* 첫 화면 */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{border:var(--bw) solid var(--ink);border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:14px;min-width:0}
.stat .emo{font-size:2.1rem;line-height:1}
.stat b{display:block;font-size:2rem;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{font-size:.95rem;font-weight:700;color:var(--muted)}
.plan{font-size:clamp(1.5rem,3.4vw,2.1rem);font-weight:900}
.route{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;list-style:none;margin:0;padding:0}
.route li{border:var(--bw) solid var(--faint);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center;font-weight:700;min-width:0}
.route li .n{font-weight:900;font-size:1.2rem}
.route li.done{border-color:var(--good);background:var(--good-bg)}
.route li.now{border-color:var(--ink)}
.route li small{margin-left:auto;color:var(--muted);font-size:.85rem}
.wordrow{display:flex;flex-wrap:wrap;gap:8px}
.wordrow .chip{font-size:1.05rem;padding:5px 14px}
.sample{font-size:.95rem;color:var(--muted)}

/* 낱말 카드 */
.headword{font-size:clamp(3rem,9vw,4.8rem);font-weight:900;line-height:1.1;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.hanja{font-size:1.25rem;font-weight:700;color:var(--muted)}
.meaning{font-size:clamp(1.35rem,3vw,1.75rem);font-weight:900;line-height:1.45}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 18px;margin:0;font-size:1.15rem}
.facts dt{font-weight:900;white-space:nowrap}
.facts dd{margin:0}

/* 퀴즈 */
.qtext{font-size:clamp(1.3rem,2.8vw,1.6rem);font-weight:900}
.qbox{background:var(--soft);border-radius:var(--r);padding:18px 20px;font-size:clamp(1.25rem,2.8vw,1.55rem);font-weight:700;line-height:1.7}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{text-align:left;background:var(--paper);border:var(--bw) solid var(--ink);border-radius:var(--r);padding:16px 18px;min-height:74px;font-size:1.15rem;font-weight:700;line-height:1.45;display:flex;gap:12px;align-items:center}
.opt .k{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:1rem}
.opt.word{font-size:1.6rem;font-weight:900;justify-content:center}
.opt.word .k{display:none}
.opt.ox{font-size:3.4rem;font-weight:900;justify-content:center;min-height:120px}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.opt:disabled:not(.right):not(.wrong){opacity:.45}
.fb{border:var(--bw) dashed var(--good);background:var(--good-bg);border-radius:var(--r);padding:14px 18px;display:flex;flex-direction:column;gap:6px;font-size:1.1rem}
.fb.no{border-color:var(--bad);background:var(--bad-bg)}
.fb .t{font-weight:900;font-size:1.3rem}
.fb.ok .t{color:var(--good)} .fb.no .t{color:var(--bad)}

/* 짝 맞추기 */
.match{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:14px}
.match .col{display:flex;flex-direction:column;gap:10px;min-width:0}
.tile{background:var(--paper);border:var(--bw) solid var(--ink);border-radius:var(--r);padding:12px 16px;min-height:72px;text-align:left;font-size:1.08rem;font-weight:700;line-height:1.4}
.tile.w{font-size:1.5rem;font-weight:900;text-align:center}
.tile.sel{background:var(--ink);color:var(--paper)}
.tile.gone{border-color:var(--good);background:var(--good-bg);color:var(--good);opacity:.7}
.tile.shake{animation:shake .35s;border-color:var(--bad);background:var(--bad-bg)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 단어장 */
.wlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.witem{border:var(--bw) solid var(--ink);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.witem .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.witem .w{font-size:1.45rem;font-weight:900}
.witem .m{font-size:1.02rem;color:var(--muted);font-weight:700}
.witem .mine{font-size:1rem;border-top:2px dashed var(--faint);padding-top:6px}
.witem .due{font-size:.9rem;color:var(--muted)}
.lv{display:inline-flex;gap:4px;align-items:center}
.lv i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:var(--paper)}
.lv i.on{background:var(--good);border-color:var(--good)}
.empty{grid-column:1/-1;text-align:center;padding:40px 16px;font-weight:700;color:var(--muted)}

/* 설정 */
.choices{display:flex;flex-wrap:wrap;gap:10px}
label.ch{display:flex;align-items:center;gap:10px;border:var(--bw) solid var(--ink);border-radius:10px;padding:10px 18px;font-weight:900;cursor:pointer}
label.ch:has(input:checked){background:var(--ink);color:var(--paper)}
label.ch input{width:20px;height:20px;accent-color:var(--hl)}
input[type=text],textarea{width:100%;font:inherit;font-weight:700;border:var(--bw) solid var(--ink);border-radius:10px;padding:12px 14px;background:var(--paper);color:var(--ink)}
textarea{min-height:110px;resize:vertical;font-size:1.2rem}
.teacher{border-style:dashed}

/* 축하 */
.stars{display:flex;justify-content:center;gap:12px;font-size:clamp(3rem,8vw,4.4rem);line-height:1}
.stars span{animation:pop .5s both}
.stars span:nth-child(2){animation-delay:.12s}.stars span:nth-child(3){animation-delay:.24s}
.stars .off{filter:grayscale(1);opacity:.3}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:820px){
  .seg.steps{--n:3!important}
  .route{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  body{font-size:17px}
  .opts,.wlist{grid-template-columns:1fr}
  .opts.words,.opts.oxs{grid-template-columns:1fr 1fr}
  .stats{gap:8px}.stat{flex-direction:column;align-items:flex-start;gap:4px;padding:10px 12px}.stat .emo{font-size:1.6rem}.stat b{font-size:1.6rem}
  .route{grid-template-columns:1fr}
  .match{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:8px}
  .tile{font-size:.95rem;padding:10px}.tile.w{font-size:1.15rem}
  .btn{font-size:1.15rem;padding:12px 18px}
  .seg > *{font-size:.92rem}
}
</style>

<style>body{margin:0}[hidden]{display:none!important}.hd h1{user-select:none}</style>

const KEY="nalmal.v1";
const DEF={name:"우리반 친구",grades:[4,5,6],subjects:["국어","과학"],perDay:10,cards:{},log:{},streak:0,lastDone:null,sentences:{},dayOffset:0,days:0};
let S=load();
function load(){try{const r=JSON.parse(localStorage.getItem(KEY)||"null");if(r){const o=Object.assign(structuredClone(DEF),r);o.subjects=o.subjects.filter(s=>s!=="사회");if(!o.subjects.length)o.subjects=["국어","과학"];return o}}catch(e){}return structuredClone(DEF)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ============ 날짜와 복습 간격 ============ */
const INTERVAL={1:1,2:3,3:7,4:14,5:30,6:60}; // 단계 → 다음 복습까지 날 수
const MASTER=5; // 5단계 이상이면 '외운 낱말'
function today(){const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)+S.dayOffset}
function dayLabel(n){const d=new Date(n*864e5);return `${d.getUTCMonth()+1}월 ${d.getUTCDate()}일 ${"일월화수목금토"[d.getUTCDay()]}요일`}
const byId=Object.fromEntries(WORDS.map(w=>[w.id,w]));

function pool(){
  const list=WORDS.filter(w=>S.grades.includes(w.grade)&&S.subjects.includes(w.subject));
  const out=[];
  for(const g of [...S.grades].sort()){
    const q={};S.subjects.forEach(s=>q[s]=list.filter(w=>w.grade===g&&w.subject===s));
    let more=true;while(more){more=false;for(const s of S.subjects){if(q[s].length){out.push(q[s].shift());more=true}}}
  }
  return out;
}
function planToday(){
  const t=today();
  if(S.log[t])return S.log[t];
  const fresh=pool().filter(w=>!S.cards[w.id]).slice(0,S.perDay).map(w=>w.id);
  const due=Object.entries(S.cards).filter(([id,c])=>c.due<=t&&byId[id]).sort((a,b)=>a[1].due-b[1].due||a[1].box-b[1].box).slice(0,20).map(([id])=>id);
  S.log[t]={fresh,review:due,step:0,res:{},done:false};save();
  return S.log[t];
}
function buildSteps(p){
  const s=[];
  if(p.fresh.length){
    s.push({type:"cards",emo:"🃏",title:"낱말 카드",ids:p.fresh,hint:"무슨 뜻일지 먼저 떠올려 보고, '뜻 보기'를 눌러 확인해요."});
    s.push({type:"match",emo:"🧩",title:"짝 맞추기",ids:p.fresh,hint:"왼쪽 낱말을 누르고, 오른쪽에서 알맞은 뜻을 눌러요."});
    s.push({type:"quiz",kind:"w2m",emo:"✅",title:"뜻 고르기",ids:p.fresh});
    s.push({type:"quiz",kind:"blank",emo:"✏️",title:"빈칸 채우기",ids:p.fresh});
  }
  if(p.review.length) s.push({type:"quiz",kind:"mixed",emo:"🔁",title:"복습 퀴즈",ids:p.review});
  if(p.fresh.length) s.push({type:"sentence",emo:"📝",title:"나만의 문장",ids:p.fresh,opt:true});
  return s;
}

/* ============ 도움 함수 ============ */
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const NUM="①②③④⑤⑥⑦⑧⑨";
const exMark=w=>esc(w.example).replace(/\[(.+?)\]/,"<mark>$1</mark>");
const exBlank=w=>esc(w.example).replace(/\[(.+?)\]/,'<span class="hl">&nbsp;&nbsp;?&nbsp;?&nbsp;?&nbsp;&nbsp;</span>');
function others(w,n,field){
  const same=shuffle(WORDS.filter(x=>x.id!==w.id&&x.subject===w.subject));
  const rest=shuffle(WORDS.filter(x=>x.id!==w.id&&x.subject!==w.subject));
  const seen=new Set([w[field]]),out=[];
  for(const x of [...same,...rest]){if(out.length>=n)break;if(!seen.has(x[field])){seen.add(x[field]);out.push(x)}}
  return out;
}
const chip=w=>`<span class="chip c-${w.subject}">${w.subject} ${w.grade}학년</span>`;
const lv=b=>`<span class="lv" aria-label="${Math.min(b,MASTER)}단계">${[1,2,3,4,5].map(i=>`<i class="${i<=b?"on":""}"></i>`).join("")}</span>`;
function counts(){
  const c=Object.values(S.cards);
  return{learned:c.length,master:c.filter(x=>x.box>=MASTER).length,hard:c.filter(x=>x.wrong>0&&x.box<=2).length};
}
function header(pillHtml){
  return `<header class="hd"><h1><span class="emo">📖</span>우리반 낱말 공책</h1><span class="pill">${pillHtml}</span></header>`;
}
function menu(){
  const items=[["home","📅 오늘 공부"],["book","📚 단어장"],["set","⚙️ 설정"]];
  return `<nav class="seg" style="--n:3">${items.map(([k,l])=>`<button type="button" data-go="${k}" class="${view===k?"on":""}">${l}</button>`).join("")}</nav>`;
}
function bindMenu(){document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go))}
const masterPill=()=>`외운 낱말 <span class="emo">⭐</span> ${counts().master}개`;

/* ============ 화면 전환 ============ */
let view="home",sess=null,bookTab="all";
function go(v){view=v;sess=null;render();window.scrollTo(0,0)}
function render(){
  if(sess)return renderStep();
  ({home:renderHome,book:renderBook,set:renderSet})[view]();
  bindMenu();
}

/* ============ 오늘 화면 ============ */

      ${c.learned?`<div class="acts"><span class="sp"></span><button class="btn" id="prac" type="button">배운 낱말로 연습하기 ▶</button></div>`:""}</section>`;

      <div class="stars"><span class="emo">⭐</span><span class="emo">⭐</span><span class="emo">⭐</span></div>
      <p class="plan" style="text-align:center">오늘 공부 끝! 잘했어요</p>
      <div class="hint"><span class="emo">📅</span><span><b>내일은</b> 새 낱말 ${Math.min(S.perDay,left)}개와 복습 낱말 ${tomorrow}개가 기다리고 있어요.</span></div>
      <div class="acts"><span class="sp"></span><button class="btn" id="prac" type="button">배운 낱말로 더 연습하기 ▶</button></div></section>`;

      <p class="plan">새 낱말 ${p.fresh.length}개${p.review.length?` + 복습 ${p.review.length}개`:""}</p>
      ${p.fresh.length?`<div class="wordrow">${p.fresh.map(id=>`<span class="chip c-${byId[id].subject}">${esc(byId[id].word)}</span>`).join("")}</div>`:""}
      <ol class="route">${steps.map((s,i)=>`<li class="${i<p.step?"done":i===p.step?"now":""}"><span class="n">${i<p.step?"✓":NUM[i]}</span><span class="emo">${s.emo}</span><span>${s.title}</span>${s.opt?"<small>선택</small>":""}</li>`).join("")}</ol>
      <div class="acts"><span class="muted">하루 10~15분이면 끝나요.</span><button class="btn" id="start" type="button">${p.step>0?"이어서 하기":"시작하기"} ▶</button></div></section>`;

  $("#app").innerHTML=`${header(masterPill())}${menu()}
    <div class="stats">

    ${SAMPLE?`<p class="sample">지금은 예시 낱말 30개로 움직이는 미리보기예요. 교과서 낱말로 바꿔 넣을 예정입니다.</p>`:""}`;

/* ============ 학습 진행 ============ */
function startSession(){const p=planToday();sess={p,steps:buildSteps(p),practice:false,score:0};initStep();render();window.scrollTo(0,0)}
function startPractice(){
  const ids=shuffle(Object.keys(S.cards).filter(id=>byId[id])).slice(0,10);
  if(!ids.length)return;
  sess={p:{step:0,res:{}},steps:[{type:"quiz",kind:"mixed",emo:"🎯",title:"자유 연습",ids}],practice:true,score:0};initStep();render();window.scrollTo(0,0);
}
function initStep(){
  const s=sess.steps[sess.p.step];if(!s)return;
  sess.i=0;sess.flip=false;sess.first={};
  if(s.type==="quiz"){
    const kinds=["w2m","m2w","blank","ox"];
    sess.queue=shuffle(s.ids).map(id=>({id,kind:s.kind==="mixed"?kinds[Math.random()*4|0]:s.kind}));
    sess.total=sess.queue.length;sess.doneQ=0;
  }
  if(s.type==="match"){sess.rounds=[];const ids=shuffle(s.ids);for(let i=0;i<ids.length;i+=5)sess.rounds.push(ids.slice(i,i+5));sess.r=0;sess.gone=new Set();sess.sel=null;sess.order=null}
}
function nextStep(){
  if(sess.practice){sess=null;view="home";return render()}
  sess.p.step++;save();
  if(sess.p.step>=sess.steps.length)return finish();
  initStep();render();window.scrollTo(0,0);
}
function sessTop(){
  const k=sess.p.step,n=sess.steps.length;
  return `${header(`맞힌 문제 <span class="emo">⭐</span> ${sess.score}개`)}
  <div class="seg steps" style="--n:${n}">${sess.steps.map((s,i)=>`<span class="${i===k?"on":i<k?"done":""}">${i<k?"✓":NUM[i]} ${s.title}</span>`).join("")}</div>`;
}
const quitBtn=`<button class="btn w" id="quit" type="button">✕ 그만하기</button>`;
function bindQuit(){const q=$("#quit");if(q)q.onclick=()=>{save();sess=null;view="home";render()}}
function renderStep(){
  const s=sess.steps[sess.p.step];
  ({cards:stepCards,match:stepMatch,quiz:stepQuiz,sentence:stepSentence})[s.type](s);
  bindQuit();
}

/* ① 낱말 카드 */
function stepCards(s){
  const w=byId[s.ids[sess.i]],last=sess.i===s.ids.length-1;
  $("#app").innerHTML=`${sessTop()}
   <section class="panel">
     <div class="label"><span>새 낱말 ${sess.i+1} / ${s.ids.length}</span>${chip(w)}</div>
     <div class="headword"><span class="hl">${esc(w.word)}</span>${w.hanja?`<span class="hanja">${esc(w.hanja)}</span>`:""}</div>
     ${sess.flip?`<p class="meaning">${esc(w.meaning)}</p>
       <dl class="facts"><dt>예문</dt><dd>${exMark(w)}</dd>${w.hanja?`<dt>한자</dt><dd>${esc(w.hanja)} — ${esc(w.hanjaMean)}</dd>`:""}${w.similar?`<dt>비슷한말</dt><dd>${esc(w.similar)}</dd>`:""}${w.opposite?`<dt>반대말</dt><dd>${esc(w.opposite)}</dd>`:""}<dt>단원</dt><dd class="muted">${esc(w.unit)}</dd></dl>`
     :`<div class="hint"><span class="emo">🤔</span><span><b>생각해 보기</b> ${s.hint}</span></div>`}
     <div class="acts"><button class="btn w" id="prev" type="button" ${sess.i?"":"disabled"}>◀ 이전</button>
       ${sess.flip?`<button class="btn" id="next" type="button">${last?"짝 맞추기로":"다음 낱말"} ▶</button>`:`<button class="btn" id="flip" type="button">뜻 보기 ▶</button>`}</div>
   </section>
   <div class="acts">${quitBtn}</div>`;
  $("#prev").onclick=()=>{sess.i--;sess.flip=true;renderStep()};
  const f=$("#flip");if(f)f.onclick=()=>{sess.flip=true;renderStep()};
  const n=$("#next");if(n)n.onclick=()=>{if(last)return nextStep();sess.i++;sess.flip=false;renderStep()};
}

/* ② 짝 맞추기 */
function stepMatch(s){
  const ids=sess.rounds[sess.r];
  if(!sess.order)sess.order={w:shuffle(ids),m:shuffle(ids)};
  const left=ids.filter(id=>!sess.gone.has(id)).length;
  $("#app").innerHTML=`${sessTop()}
   <section class="panel">
     <div class="label"><span>${sess.r+1} / ${sess.rounds.length}판</span><span>남은 짝 ${left}개</span></div>
     <div class="hint"><span class="emo">🧩</span><span>${s.hint}</span></div>
     <div class="match"><div class="col">${sess.order.w.map(id=>`<button type="button" class="tile w ${sess.gone.has(id)?"gone":""} ${sess.sel===id?"sel":""}" data-w="${id}" ${sess.gone.has(id)?"disabled":""}>${esc(byId[id].word)}</button>`).join("")}</div>
     <div class="col">${sess.order.m.map(id=>`<button type="button" class="tile ${sess.gone.has(id)?"gone":""}" data-m="${id}" ${sess.gone.has(id)?"disabled":""}>${esc(byId[id].meaning)}</button>`).join("")}</div></div>
   </section>
   <div class="acts">${quitBtn}</div>`;
  const shake=b=>{b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake")};
  document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{sess.sel=b.dataset.w;renderStep()});
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{
    if(!sess.sel)return shake(b);
    if(b.dataset.m!==sess.sel)return shake(b);
    sess.gone.add(sess.sel);sess.sel=null;renderStep();
    if(ids.every(id=>sess.gone.has(id))){
      if(sess.r<sess.rounds.length-1)setTimeout(()=>{sess.r++;sess.order=null;renderStep()},450);
      else setTimeout(nextStep,550);
    }
  });
}

/* ③ ④ ⑤ 퀴즈 */
function makeQ(q){
  const w=byId[q.id];
  if(q.kind==="w2m"){const o=shuffle([w,...others(w,3,"meaning")]);return{w,html:`<p class="qtext">이 낱말의 뜻은 무엇일까요?</p><div class="headword"><span class="hl">${esc(w.word)}</span></div>`,opts:o.map(x=>({t:x.meaning,ok:x.id===w.id})),cls:""}}
  if(q.kind==="m2w"){const o=shuffle([w,...others(w,3,"word")]);return{w,html:`<p class="qtext">이런 뜻을 가진 낱말은 무엇일까요?</p><div class="qbox">${esc(w.meaning)}</div>`,opts:o.map(x=>({t:x.word,ok:x.id===w.id})),cls:"words"}}
  if(q.kind==="blank"){const o=shuffle([w,...others(w,3,"word")]);return{w,html:`<p class="qtext">빈칸에 들어갈 알맞은 낱말은 무엇일까요?</p><div class="qbox">${exBlank(w)}</div>`,opts:o.map(x=>({t:x.word,ok:x.id===w.id})),cls:"words"}}
  const real=Math.random()<.5,m=real?w.meaning:others(w,1,"meaning")[0].meaning;
  return{w,html:`<p class="qtext">낱말과 뜻이 알맞게 짝지어졌으면 O, 아니면 X를 눌러요.</p><div class="headword"><span class="hl">${esc(w.word)}</span></div><div class="qbox">${esc(m)}</div>`,opts:[{t:"O",ok:real},{t:"X",ok:!real}],cls:"oxs"};
}
function stepQuiz(s){
  if(!sess.queue.length)return nextStep();
  const q=sess.queue[0];
  if(!q.built)q.built=makeQ(q);
  const b=q.built,isW=b.cls==="words",isOX=b.cls==="oxs";
  $("#app").innerHTML=`${sessTop()}
   <section class="panel">
     <div class="label"><span>문제 ${Math.min(sess.doneQ+1,sess.total)} / ${sess.total}${q.retry?" · 다시 풀기":""}</span>${chip(b.w)}</div>
     ${b.html}
     <div class="opts ${b.cls}">${b.opts.map((o,i)=>`<button type="button" class="opt ${isW?"word":""} ${isOX?"ox":""}" data-i="${i}"><span class="k">${i+1}</span><span>${esc(o.t)}</span></button>`).join("")}</div>
     <div id="fb" aria-live="polite"></div>
   </section>
   <div class="acts">${quitBtn}<span id="nqslot"></span></div>`;
  document.querySelectorAll(".opt").forEach(btn=>btn.onclick=()=>{
    const o=b.opts[+btn.dataset.i],w=b.w;
    document.querySelectorAll(".opt").forEach((x,i)=>{x.disabled=true;if(b.opts[i].ok)x.classList.add("right")});
    if(!o.ok)btn.classList.add("wrong");
    const key=q.id+q.kind;
    if(!(key in sess.first)){sess.first[key]=o.ok;if(o.ok)sess.score++;
      if(!sess.practice){const r=sess.p.res;r[q.id]=(r[q.id]??true)&&o.ok;save()}}
    $("#fb").innerHTML=`<div class="fb ${o.ok?"ok":"no"}"><span class="t">${o.ok?"⭕ 맞았어요!":"❌ 아쉬워요. 이 문제는 조금 뒤에 다시 나와요."}</span>
      <span><b class="hl">${esc(w.word)}</b> : ${esc(w.meaning)}</span><span class="muted">${exMark(w)}</span></div>`;
    sess.queue.shift();
    if(o.ok)sess.doneQ++;else sess.queue.push({id:q.id,kind:q.kind,retry:true});
    const lastQ=!sess.queue.length;
    $("#nqslot").innerHTML=`<button class="btn" id="nq" type="button">${lastQ?"다음 활동":"다음 문제"} ▶</button>`;
    $("#nq").onclick=()=>{renderStep();window.scrollTo(0,0)};
    $("#nq").focus({preventScroll:true});
    $("#fb").scrollIntoView({behavior:"smooth",block:"nearest"});
  });
}

/* ⑥ 나만의 문장 */
function stepSentence(s){
  const stem=w=>w.word.replace(/ /g,"").replace(/(하다|되다|다)$/,"");
  const k=sess.i||0,w=byId[s.ids[k]];
  $("#app").innerHTML=`${sessTop()}
   <section class="panel">
     <div class="label"><span>오늘 배운 낱말 가운데 하나를 골라요</span><span class="muted">선택 활동</span></div>
     <div class="wordrow">${s.ids.map((id,i)=>`<button type="button" class="chip c-${byId[id].subject}" data-k="${i}" style="${i===k?"background:var(--ink);color:var(--paper);border-color:var(--ink)":""}">${S.sentences[id]?"✓ ":""}${esc(byId[id].word)}</button>`).join("")}</div>
     <div class="headword" style="font-size:clamp(2.2rem,6vw,3.2rem)"><span class="hl">${esc(w.word)}</span></div>
     <p class="meaning" style="font-size:1.25rem">${esc(w.meaning)}</p>
     <label for="snt" class="label">✍️ 나만의 문장</label>
     <textarea id="snt" placeholder="예) ${esc(w.example.replace(/[\[\]]/g,""))}">${esc(S.sentences[w.id]||"")}</textarea>
     <div id="hint" aria-live="polite"></div>
     <div class="acts"><span class="sp"></span><button class="btn w" id="sv" type="button">문장 저장하기</button></div>
   </section>
   <div class="acts">${quitBtn}<button class="btn" id="fin" type="button">오늘 공부 마치기 ▶</button></div>`;
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{sess.i=+b.dataset.k;renderStep()});
  const say=(t,ok)=>$("#hint").innerHTML=`<div class="fb ${ok?"ok":"no"}"><span>${t}</span></div>`;
  $("#sv").onclick=()=>{
    const v=$("#snt").value.trim();
    if(!v)return say("문장을 먼저 써 주세요.",false);
    if(!v.replace(/ /g,"").includes(stem(w)))return say(`문장 안에 '${esc(w.word)}'이(가) 들어가도록 써 보세요.`,false);
    S.sentences[w.id]=v;save();say("⭕ 저장했어요! 단어장의 '나의 문장'에서 다시 볼 수 있어요.",true);
  };
  $("#fin").onclick=nextStep;
}

/* ============ 마치기: 복습 단계 옮기기 ============ */
function finish(){
  const t=today(),p=sess.p;
  if(!p.done){
    for(const id of p.fresh){const ok=p.res[id]!==false;S.cards[id]={box:1,due:t+1,wrong:ok?0:1,right:ok?1:0,start:t}}
    for(const id of p.review){const c=S.cards[id];if(!c)continue;const ok=p.res[id]!==false;
      if(ok){c.box=Math.min(c.box+1,6);c.right++}else{c.box=1;c.wrong++}
      c.due=t+INTERVAL[c.box]}
    S.streak=S.lastDone===t-1?S.streak+1:(S.lastDone===t?S.streak:1);S.lastDone=t;S.days++;p.done=true;save();
  }
  const wrong=[...p.fresh,...p.review].filter(id=>p.res[id]===false);
  const okR=p.review.filter(id=>p.res[id]!==false).length;
  const stars=!wrong.length?3:wrong.length<=3?2:1;
  sess=null;view="home";
  $("#app").innerHTML=`${header(masterPill())}
   <section class="panel">
    <div class="stars">${[0,1,2].map(i=>`<span class="emo ${i<stars?"":"off"}">⭐</span>`).join("")}</div>
    <p class="plan" style="text-align:center">오늘 공부 끝! 잘했어요</p>
    <div class="stats">
      <div class="stat"><span class="emo">📗</span><div><b>${p.fresh.length}</b><small>새 낱말</small></div></div>
      <div class="stat"><span class="emo">🔁</span><div><b>${p.review.length?okR+"/"+p.review.length:"-"}</b><small>복습 정답</small></div></div>
      <div class="stat"><span class="emo">🔥</span><div><b>${S.streak}일</b><small>연속 공부</small></div></div>
    </div>
    ${wrong.length?`<div class="hint"><span class="emo">🤔</span><span><b>헷갈렸던 낱말 ${wrong.length}개</b> 내일 다시 나와요.</span></div>
      <div class="wlist">${wrong.map(id=>`<div class="witem"><div class="top"><span class="w">${esc(byId[id].word)}</span>${chip(byId[id])}</div><span class="m">${esc(byId[id].meaning)}</span></div>`).join("")}</div>`
    :`<div class="hint"><span class="emo">🎉</span><span>한 번도 틀리지 않았어요!</span></div>`}
    <div class="acts"><span class="sp"></span><button class="btn" id="home" type="button">처음 화면으로 ▶</button></div>
   </section>`;
  $("#home").onclick=()=>go("home");window.scrollTo(0,0);
}

/* ============ 단어장 ============ */
function renderBook(){
  const ids=Object.keys(S.cards).filter(id=>byId[id]);
  const tabs=[["all","전체"],["hard","🤔 헷갈리는"],["국어","국어"],["과학","과학"],["mine","📝 나의 문장"]];
  let list=ids.map(id=>byId[id]);
  if(bookTab==="hard")list=list.filter(w=>S.cards[w.id].wrong>0&&S.cards[w.id].box<=2);
  else if(["국어","과학"].includes(bookTab))list=list.filter(w=>w.subject===bookTab);
  else if(bookTab==="mine")list=list.filter(w=>S.sentences[w.id]);
  const t=today();
  $("#app").innerHTML=`${header(masterPill())}${menu()}
   <section class="panel">
     <div class="label"><span>단어장 · 배운 낱말 ${ids.length}개</span></div>
     <div class="hint"><span class="emo">🟢</span><span>초록 점이 많을수록 잘 기억하고 있는 낱말이에요. <b>점 5개</b>가 되면 '외운 낱말'이 돼요.</span></div>
     <div class="seg steps" style="--n:5">${tabs.map(([k,l])=>`<button type="button" class="${bookTab===k?"on":""}" data-t="${k}">${l}</button>`).join("")}</div>
     <div class="wlist">${list.length?list.map(w=>{const c=S.cards[w.id],d=c.due-t;return `<div class="witem"><div class="top"><span class="w">${esc(w.word)}</span>${chip(w)}</div>
       <span class="m">${esc(w.meaning)}</span>
       ${S.sentences[w.id]?`<span class="mine"><b>나의 문장</b> ${esc(S.sentences[w.id])}</span>`:""}
       <div class="top">${lv(c.box)}<span class="due">${d<=0?"오늘 복습":`${d}일 뒤 복습`}</span></div></div>`}).join("")
     :`<p class="empty">${ids.length?"여기에 해당하는 낱말이 없어요.":"아직 배운 낱말이 없어요. 오늘 공부를 마치면 여기에 모여요."}</p>`}</div>
   </section>`;
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{bookTab=b.dataset.t;renderBook();bindMenu()});
}

/* ============ 설정 ============ */
let resetArm=false,teacher=false,taps=0,tapT=0;
/* 선생님 메뉴: 제목을 빠르게 5번 누르면 설정 화면에 나타남 (학생이 날짜를 넘기거나 기록을 지우지 못하게) */
document.addEventListener("click",e=>{
  if(!e.target.closest(".hd h1"))return;
  const now=Date.now();taps=now-tapT<800?taps+1:1;tapT=now;
  if(taps>=5){taps=0;teacher=!teacher;if(!sess){view="set";render()}}
});
function renderSet(){
  $("#app").innerHTML=`${header(masterPill())}${menu()}
   <section class="panel">
     <label class="label" for="nm">내 이름</label><input type="text" id="nm" value="${esc(S.name)}" maxlength="12">
     <div class="label">공부할 학년</div><div class="choices">${[4,5,6].map(g=>`<label class="ch"><input type="checkbox" name="g" value="${g}" ${S.grades.includes(g)?"checked":""}>${g}학년</label>`).join("")}</div>
     <div class="label">공부할 과목</div><div class="choices">${["국어","과학"].map(s=>`<label class="ch"><input type="checkbox" name="s" value="${s}" ${S.subjects.includes(s)?"checked":""}>${s}</label>`).join("")}</div>
     <div class="label">하루에 배울 새 낱말</div><div class="choices">${[5,10,15].map(n=>`<label class="ch"><input type="radio" name="pd" value="${n}" ${S.perDay===n?"checked":""}>${n}개</label>`).join("")}</div>
     <div class="hint"><span class="emo">💡</span><span>바꾼 설정은 내일 공부부터 적용돼요.</span></div>
     <div id="msg" aria-live="polite"></div>
     <div class="acts"><span class="sp"></span><button class="btn" id="sv" type="button">저장하기</button></div>
   </section>
   ${teacher?`<section class="panel teacher">
     <div class="label">👩‍🏫 선생님용 미리보기</div>
     <p>날짜를 하루씩 넘겨서 복습이 어떻게 나오는지 확인할 수 있어요. 학생에게 나눠 주기 전에 '처음부터 다시'를 눌러 주세요.</p>
     <div class="acts"><button class="btn w" id="skip" type="button">하루 넘기기 (지금 ${S.dayOffset}일 뒤)</button>
     <button class="btn ${resetArm?"danger":"w"}" id="rs" type="button">${resetArm?"정말 지울까요? 한 번 더 누르기":"처음부터 다시"}</button></div>
   </section>`:""}`;
  $("#sv").onclick=()=>{
    const g=[...document.querySelectorAll("[name=g]:checked")].map(x=>+x.value),s=[...document.querySelectorAll("[name=s]:checked")].map(x=>x.value);
    if(!g.length||!s.length){$("#msg").innerHTML=`<div class="fb no">학년과 과목을 하나 이상 골라 주세요.</div>`;return}
    S.name=$("#nm").value.trim()||"우리반 친구";S.grades=g;S.subjects=s;S.perDay=+document.querySelector("[name=pd]:checked").value;save();
    $("#msg").innerHTML=`<div class="fb ok">⭕ 저장했어요.</div>`;
  };
  if(!teacher)return;
  $("#skip").onclick=()=>{S.dayOffset++;save();renderSet();bindMenu()};
  $("#rs").onclick=()=>{if(!resetArm){resetArm=true;renderSet();bindMenu();return}resetArm=false;S=structuredClone(DEF);save();go("home")};
}

render();
</script>

</body>
</html>
